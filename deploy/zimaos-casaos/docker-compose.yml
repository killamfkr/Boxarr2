# Boxarr stack for CasaOS / ZimaOS
# Generated by install.sh — paths and user IDs are substituted at install time.
#
# Host rclone mode (default): TorBox is mounted on the host at BOXARR_TORBOX_MOUNT.
# Docker rclone mode: the rclone service below is enabled by install.sh.

services:
  boxarr:
    image: ${BOXARR_IMAGE:-ghcr.io/radaiko/boxarr:latest}
    container_name: boxarr
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    environment:
      - BOXARR_DATABASE_PATH=/config/boxarr.db
      - BOXARR_LISTEN_ADDR=:8080
      - TZ=${TZ:-UTC}
      - BOXARR_TORBOX_API_TOKEN=${TORBOX_API_KEY:-}
      - BOXARR_PROWLARR_URL=${PROWLARR_URL:-http://host.docker.internal:9696}
      - BOXARR_PROWLARR_API_KEY=${PROWLARR_API_KEY:-}
      - BOXARR_TMDB_API_KEY=${TMDB_API_KEY:-}
      - BOXARR_SEERR_API_KEYS=${BOXARR_SEERR_API_KEY:-}
      - BOXARR_WEBDAV_MOUNT_ROOT=${BOXARR_TORBOX_MOUNT}
      - BOXARR_MOVIE_LIBRARY_ROOT=${BOXARR_LIBRARY_ROOT}/movies
      - BOXARR_TV_LIBRARY_ROOT=${BOXARR_LIBRARY_ROOT}/tv
      - BOXARR_ANIME_LIBRARY_ROOT=${BOXARR_LIBRARY_ROOT}/anime
      - BOXARR_PLEX_URL=${PLEX_URL:-}
      - BOXARR_PLEX_TOKEN=${PLEX_TOKEN:-}
    ports:
      - "${BOXARR_PORT:-8181}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${BOXARR_INSTALL_DIR}/config:/config
      - ${BOXARR_LIBRARY_ROOT}:${BOXARR_LIBRARY_ROOT}
      - type: bind
        source: ${BOXARR_TORBOX_MOUNT}
        target: ${BOXARR_TORBOX_MOUNT}
        bind:
          propagation: rslave
    healthcheck:
      test: ["CMD", "/boxarr", "healthcheck"]
      interval: 60s
      timeout: 5s
      retries: 3
    networks:
      - boxarr

  rclone:
    profiles: ["docker-rclone"]
    image: rclone/rclone:latest
    container_name: boxarr-rclone
    restart: unless-stopped
    cap_add: [SYS_ADMIN]
    devices: ["/dev/fuse:/dev/fuse"]
    security_opt: ["apparmor:unconfined"]
    environment:
      - TZ=${TZ:-UTC}
    volumes:
      - ${BOXARR_INSTALL_DIR}/rclone/rclone.conf:/config/rclone/rclone.conf:ro
      - ${BOXARR_INSTALL_DIR}/rclone/cache:/cache
      - type: bind
        source: ${BOXARR_TORBOX_MOUNT}
        target: /data
        bind:
          propagation: rshared
    command: >
      mount ${RCLONE_REMOTE:-torbox}: /data
      --config /config/rclone/rclone.conf
      --allow-other --allow-non-empty --dir-cache-time 1h
      --vfs-cache-mode full --vfs-cache-max-size 50G --vfs-cache-max-age 168h
      --vfs-read-ahead 256M --vfs-read-chunk-size 32M --vfs-read-chunk-size-limit 1G
      --buffer-size 64M --vfs-fast-fingerprint --no-checksum --no-modtime
      --transfers 4 --checkers 2 --tpslimit 5 --tpslimit-burst 5 --low-level-retries 3
      --attr-timeout 9999h --umask 002 --uid ${PUID} --gid ${PGID}
      --cache-dir /cache --log-level INFO
    networks:
      - boxarr

  seerr:
    profiles: ["seerr"]
    image: ghcr.io/seerr-team/seerr:latest
    container_name: boxarr-seerr
    init: true
    restart: unless-stopped
    environment:
      - LOG_LEVEL=info
      - TZ=${TZ:-UTC}
      - PORT=5055
    volumes:
      - ${BOXARR_INSTALL_DIR}/seerr:/app/config
    ports:
      - "${SEERR_PORT:-5055}:5055"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - boxarr

networks:
  boxarr:
    name: boxarr
    driver: bridge
